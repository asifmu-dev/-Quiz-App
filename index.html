<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <main class="quiz-container">
        <header class="quiz-header">
            <h1>Quiz Master</h1>
            <p>Test your knowledge and have fun!</p>
        </header>

        <section id="quiz-screen">
            <div class="quiz-info">
                <span id="question-count"></span>
                <span id="score">Score: 0</span>
            </div>
            <h2 id="question"></h2>
            <div id="options" class="options-container"></div>
            <button id="next-btn" class="next-btn" disabled>Next Question</button>
        </section>

        <section id="result-screen" class="result-screen" hidden>
            <div class="result-icon">🏆</div>
            <h2>Quiz Completed!</h2>
            <p id="result-message"></p>
            <p id="final-score"></p>
            <button id="restart-btn" class="next-btn">Restart Quiz</button>
        </section>
    </main>
    <script src="assets/js/script.js"></script>
</body>
</html>
